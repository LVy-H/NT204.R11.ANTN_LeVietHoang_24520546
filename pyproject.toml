[project]
name = "pcparser"
version = "0.1.0"
description = "Packet Capture & Parser module for an Intrusion Detection System (IDS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ids", "pcap", "packet-capture", "parser", "network-security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]
dependencies = [
    "scapy>=2.7.0",
]

[project.scripts]
pcparser = "pcparser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pcparser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:pcparser.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"TEST/*" = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
